# Весь стек системы: docker compose up -d поднимает всё сразу.
#
#   api         — REST API + веб-интерфейс (порт 8000)
#   open-webui  — чат-интерфейс OpenWebUI   (порт 3000)
#   pipelines   — наш OpenWebUI Pipeline    (порт 9099)

services:
  api:
    build: .
    container_name: mtbank-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # общий кэш скачанных моделей: Whisper и pyannote качаются один раз
      # и переживают пересоздание контейнеров
      - model-cache:/home/appuser/.cache
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  pipelines:
    build:
      context: .
      dockerfile: Dockerfile.pipelines
    container_name: pipelines
    ports:
      - "9099:9099"
    volumes:
      # код подключаем томами, а не копируем в образ — правки применяются
      # перезапуском контейнера, без пересборки
      - ./pipelines:/app/pipelines
      - ./asr:/app/asr
      - ./agents:/app/agents
      - ./pipeline.py:/app/pipeline.py
      - ./llm_json.py:/app/llm_json.py
      - ./settings.py:/app/settings.py
      - ./logger.py:/app/logger.py
      - ./audio_input.py:/app/audio_input.py
      - model-cache:/root/.cache
    env_file:
      - .env
    restart: unless-stopped

volumes:
  open-webui-data:
  model-cache:
